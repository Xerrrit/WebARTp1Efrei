<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-box position="2 2 0" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="0 2 0" rotation="0 0 0" color="#E9C46A"></a-box>
      <a-box position="-2 2 0" rotation="0 0 0" color="#2f2f2f"></a-box>

      <a-marker preset="hiro">
        <a-box
          id="interactiveBox"
          class="clickable"
          color="#4CC3D9"
          material="transparent: true; opacity: 0.5"
          width="1.5"
          height="1.5"
          depth="1.5"
          position="0 0.75 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
        </a-box>
      </a-marker>

      <a-entity camera look-controls>
        <a-cursor
          raycaster="objects: .clickable"
          fuse="false"
          color="#ffffff">
        </a-cursor>
      </a-entity>
    </a-scene>

    <script>
      const box = document.getElementById('interactiveBox');
      const colors = ['#4CC3D9', '#FF5733', '#2ECC71', '#F1C40F'];
      let currentColorIndex = 0;

      box.addEventListener('click', function () {
        currentColorIndex = (currentColorIndex + 1) % colors.length;
        box.setAttribute('color', colors[currentColorIndex]);
      });
    </script>
  </body>
</html>
