<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 999;
        background: white;
        padding: 10px;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <div id="ui">
      Taille :
      <input
        id="sizeSlider"
        type="range"
        min="0.1"
        max="3"
        step="0.1"
        value="1"
      >

      <br><br>

      Couleur :
      <button id="red">Rouge</button>
      <button id="green">Vert</button>
      <button id="blue">Bleu</button>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
    >

      <a-marker id="hiroMarker" preset="hiro">

        <a-box
          id="interactiveBox"
          class="clickable"
          color="#4CC3D9"
          material="transparent: true; opacity: 0.5"
          width="2"
          height="2"
          depth="2"
          position="0 1 0"
          animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            dur: 2000;
            easing: linear
          "
        >
        </a-box>

      </a-marker>

      <a-marker
        type="pattern"
        url="pattern-marker.patt"
      >
        <a-triangle
          color="green"
          vertex-a="0 1 0"
          vertex-b="-1 -1 0"
          vertex-c="1 -1 0"
          position="0 1 0"
          rotation="-90 0 0"
        >
        </a-triangle>
      </a-marker>

      <a-entity camera>
        <a-cursor
          raycaster="objects: .clickable"
          fuse="false"
          color="#FFFFFF"
        >
        </a-cursor>
      </a-entity>

    </a-scene>

    <script>
      const box = document.getElementById('interactiveBox');
      const marker = document.getElementById('hiroMarker');
      const ui = document.getElementById('ui');
      const slider = document.getElementById('sizeSlider');

      const colors = [
        '#4CC3D9',
        '#FF5733',
        '#2ECC71',
        '#F1C40F'
      ];

      let currentColorIndex = 0;

      function changeColor() {
        currentColorIndex =
          (currentColorIndex + 1) % colors.length;

        box.setAttribute(
          'color',
          colors[currentColorIndex]
        );

        box.setAttribute('animation', {
          property: 'rotation',
          to: '0 360 0',
          loop: true,
          dur: 500,
          easing: 'linear'
        });

        box.setAttribute(
          'scale',
          '1.5 1.5 1.5'
        );
      }

      box.addEventListener('click', changeColor);

      box.addEventListener('touchstart', function (event) {
        event.preventDefault();
        changeColor();
      });

      ui.style.display = 'none';

      marker.addEventListener('markerFound', function () {
        ui.style.display = 'block';
      });

      marker.addEventListener('markerLost', function () {
        ui.style.display = 'none';
      });

      slider.addEventListener('input', function () {
        const size = this.value;

        box.setAttribute(
          'scale',
          size + ' ' + size + ' ' + size
        );
      });

      document.getElementById('red').addEventListener('click', function () {
        box.setAttribute('color', 'red');
      });

      document.getElementById('green').addEventListener('click', function () {
        box.setAttribute('color', 'green');
      });

      document.getElementById('blue').addEventListener('click', function () {
        box.setAttribute('color', 'blue');
      });
    </script>

  </body>
</html>
