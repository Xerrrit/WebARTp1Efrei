<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body>
    <a-scene arjs>
      <a-box position="2 2 -3" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="0 2 -3" rotation="0 0 0" color="#EZcx29"></a-box>
      <a-box position="-2 2 -3" rotation="0 0 0" color="#2f2f2f"></a-box>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-camera position="0 10 5" wasd-controls-enabled="true"></a-camera>
      <a-sky color="#ECECEC"></a-sky>

      <a-marker preset="hiro">
        <a-box
          color="#4CC3D9"
          material="transparent: true; opacity: 0.5"
          width="10"
          height="10"
          depth="10"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
        </a-box>
      </a-marker>

    </a-scene>
  </body>
</html>
